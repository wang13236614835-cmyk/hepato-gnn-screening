function warnLS(){ setTimeout(()=>{ const el=document.getElementById('hmeta'); if(el) el.insertAdjacentHTML('beforeend','<span class="chip dead">⚠️ 本浏览器禁止本地存储，进度仅本次有效，请及时导出</span>'); },0); }
function save(){ try{ localStorage.setItem(SKEY, JSON.stringify(S)); }catch(e){} }
function logAct(action, id, text){ S.log.unshift({t:fmtDT(new Date()),action,id,text}); if(S.log.length>800) S.log.length=800; save(); }
function fmtDT(d){ const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }

/* ================= 工具函数 ================= */
function weekNoNow(){ const d=new Date(); const diff=Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate())-START)/(7*864e5))+1; return Math.max(0,Math.min(NWEEK+1,diff)); }
function wkDoneCount(w){ let n=S.checks?0:0; n=0; w.tasks.forEach(([id])=>{ if(S.done[id]) n++; }); MANUALS.filter(m=>m.week===w.no).forEach(m=>{ if(S.done[m.id]) n++; }); w.checks.forEach(c=>{ if(S.checks[c.id]) n++; }); return n; }
function wkTotal(w){ return w.tasks.length + MANUALS.filter(m=>m.week===w.no).length + w.checks.length; }
function overall(){ let d=0,t=0; WEEKS.forEach(w=>{ d+=wkDoneCount(w); t+=wkTotal(w); }); return [d,t]; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
/* 路径直达链接：只链接"带目录的仓库内路径"或少数根目录文件，裸文件名不链接（防误链） */
const ROOTFILES = new Set(["run_all.py","README.md","requirements.txt","CONTRIBUTORS.md"]);
function linkPaths(s){
  let lastDir = "";
  return esc(s).split(/(、|，|,)/).map(part=>{
    const m = part.match(/^([A-Za-z0-9_\/\.\-一-鿿]+)\.(py|md|csv|sh|json|txt|html|png|pdf)$/);
    if(!m){
      const d = part.match(/^([A-Za-z0-9_\-一-鿿]+(?:\/[A-Za-z0-9_\-一-鿿]+)+\/)$/);
      if(d) lastDir = d[1];
      return part;
    }
    const tok = m[0];
    if(tok.includes("/")){ lastDir = tok.slice(0, tok.lastIndexOf("/")+1);
      return `<a class="pl" href="../${tok}" title="本地打开直达">${tok}</a>`; }
    if(ROOTFILES.has(tok)) return `<a class="pl" href="../${tok}">${tok}</a>`;
    if(lastDir) return `<a class="pl" href="../${lastDir}${tok}" title="本地打开直达">${tok}</a>`;
    return tok;
  }).join("");
}
function msDone(m){ return m.need.length>0 && m.need.every(id => S.checks[id] || S.done[id]); }
function findTask(id){ for(const w of WEEKS){ for(const [tid,tx] of w.tasks){ if(tid===id) return {tx,week:w.no}; } } for(const m of MANUALS){ if(m.id===id) return {tx:m.text,week:m.week,manual:true}; } for(const w of WEEKS){ for(const c of w.checks){ if(c.id===id) return {tx:c.desc,week:w.no,check:true}; } } for(const r of RES){ if(r.id===id) return {tx:r.name,week:r.wk,res:true}; } return {tx:id,week:"?"}; }

/* ================= 视图 ================= */
let VIEW = "mywork", CURW = Math.max(1,Math.min(NWEEK,weekNoNow()||1));

function header(){
  const wn = weekNoNow(); const [d,t] = overall(); const pct = t? Math.round(d*100/t):0;
  const resDone = RES.filter(r=>S.res[r.id]).length;
  let wnTxt = wn===0?`距9月7日开学 ${Math.ceil((START-new Date())/864e5)} 天（开学前预习）`:(wn>NWEEK?"学期结束后（论文投稿/返修窗口）":`学期第 ${wn} 周`);
  document.getElementById("hmeta").innerHTML =
    `<span class="chip">📅 ${wnTxt} · 2026-09-07 开学 · 16周</span>`+
    `<span class="chip">📈 总打卡 ${d}/${t}（${pct}%）</span>`+
    `<span class="chip">📺 视频学习 ${resDone}/${RES.length}</span>`+
    `<span class="chip">🎯 阶段目标 ${MILESTONES.filter(msDone).length}/${MILESTONES.length}</span>`;
}

function render(){
  header();
  const app = document.getElementById("app");
  if(VIEW==="mywork") app.innerHTML = vMyWork();
  else if(VIEW==="pipeline") app.innerHTML = vPipeline();
  else if(VIEW==="dash") app.innerHTML = vDash();
  else if(VIEW==="overview") app.innerHTML = vOverview();
  else if(VIEW==="week") app.innerHTML = vWeek(CURW);
  else if(VIEW==="res") app.innerHTML = vRes();
  else if(VIEW==="ledger") app.innerHTML = vLedger();
  else if(VIEW==="data") app.innerHTML = vData();
  bind();
}

function vWeek(n){

    const done = S.done[id];
    return `<label class="item ${done?'done':''}"><input type="checkbox" data-k="done" data-id="${id}" ${done?'checked':''}>
      <span class="tx"><span class="id">${id}</span>${esc(tx)}${done?`<span class="ts">✓ ${esc(S.done[id].slice(5,16))}</span>`:''}</span></label>`; }).join("");
  const mans = MANUALS.filter(m=>m.week===w.no).map(m=>{
    const done=S.done[m.id]; const over = m.dead && !done && new Date(m.dead.replace(/-/g,'/'))<new Date();
    return `<label class="item ${done?'done':''} ${over?'overdue':''}"><input type="checkbox" data-k="done" data-id="${m.id}" ${done?'checked':''}>

      <span class="tx"><span class="id">${c.id}</span><b>${esc(c.desc)}</b><br><span class="kv">过关标准：<b>${esc(c.exp)}</b> ｜ 出处：${linkPaths(c.src)}</span>${done?`<span class="ts">已实测✓ ${esc(S.checks[c.id].slice(5,16))}</span>`:''}</span></label>`; }).join("");

/* ================= 交互 ================= */
function goWeek(n){ CURW=Math.max(1,Math.min(NWEEK,n)); VIEW="week"; setTab("week"); render(); }
function setTab(v){ document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v)); }

function bind(){
  document.querySelectorAll("#app input[type=checkbox]").forEach(cb=>{
    cb.addEventListener("change",()=>{
      const id=cb.dataset.id, kind=cb.dataset.k;
      const info=findTask(id);
      if(kind==="check"){
        if(cb.checked && !confirm(`检查纪律：『${info.tx}』真的做完了吗？要有证据（命令结果、生成的文件、截图、PMID）才能打勾，不凭印象。`)){ cb.checked=false; return; }
        if(cb.checked){ S.checks[id]=fmtDT(new Date()); logAct("核验",id,info.tx); }
        else { delete S.checks[id]; logAct("取消",id,info.tx); }
      } else if(kind==="res"){
        if(cb.checked){ S.res[id]=fmtDT(new Date()); logAct("资源",id,info.tx); }
        else { delete S.res[id]; logAct("取消",id,info.tx); }
      } else {
        if(cb.checked){ S.done[id]=fmtDT(new Date()); logAct("打卡",id,info.tx); }
        else { delete S.done[id]; logAct("取消",id,info.tx); }
      }
      save(); render();
    });
  });
  const ta=document.getElementById("wnote");
  if(ta){ ta.addEventListener("change",()=>{ const n=CURW; const old=S.notes[n]||""; S.notes[n]=ta.value; if(old!==ta.value) logAct("备注","W"+n,(ta.value||"（清空）").slice(0,40)+"…"); save(); }); }
}

function report(n){
  const w=WEEKS[n-1], c=w.card;
  const lines=[];
  lines.push(`# 周报 · 第 ${n} 周（${w.dates}）· ${w.theme}`,"",
    `生成：学期推进流HTML打卡页 · ${fmtDT(new Date())}`,"","## 任务完成情况","");
  w.tasks.forEach(([id,tx])=>lines.push(`- [${S.done[id]?'x':' '}] ${id} ${tx}`));
  MANUALS.filter(m=>m.week===n).forEach(m=>lines.push(`- [${S.done[m.id]?'x':' '}] ${m.id} ${m.text}`));
  lines.push("","## 本周学习检查","",
    `- 学什么做什么：${c.task}`,`- 怎么动手：${c.cmd}`,`- 过关标准：${c.expected}`,`- 出处：${c.source}`,`- 没过怎么办：${c.criteria}`,`- 谁来检查：${c.verifier}`);
  const vids = RES.filter(r=>r.wk===n);
  if(vids.length){ lines.push("","## 本周视频学习","");
    vids.forEach(r=>lines.push(`- [${S.res[r.id]?'x':' '}] ${r.name}：${r.what}${r.kw?`（B站搜：${r.kw}）`:''}`)); }
  lines.push("","## 自动检查情况","");
  w.checks.forEach(ck=>lines.push(`- ${S.checks[ck.id]?'[已实测✓ '+S.checks[ck.id]+']':'[待验]'} ${ck.id} ${ck.desc}｜预期：${ck.exp}｜依据：${ck.src}`));
  if((S.notes[n]||"").trim()) lines.push("","## 本周备注","",S.notes[n]);
  const nxt=WEEKS[n]; if(nxt) lines.push("","## 下周预告","",`- 第 ${nxt.no} 周（${nxt.dates}）：${nxt.theme}（${nxt.stage}）`);
  const md=lines.join("\n");
  const ta=document.createElement("textarea"); ta.value=md; document.body.appendChild(ta); ta.select();
  let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  if(navigator.clipboard) navigator.clipboard.writeText(md).catch(()=>{});
  const w2=window.open("","_blank");
  if(w2){ w2.document.write(`<pre style="font-family:Consolas,monospace,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji","EmojiOne Color";white-space:pre-wrap;padding:20px">${md.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</pre>`); }
  alert(ok?"周报已复制到剪贴板（可直接粘贴发导师），同时在新窗口打开预览":"周报已在新窗口打开，可全选复制");
}

function exp(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`学期推进流打卡_${fmtDT(new Date()).replace(/[-: ]/g,"").slice(0,12)}.json`; a.click();
}
function imp(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d||typeof d!=="object"||!("done" in d)) throw 0;
      if(confirm("导入将覆盖当前进度，继续？")){ S=Object.assign({done:{},checks:{},notes:{},log:[]},d); save(); render(); alert("导入成功"); } }
    catch(e){ alert("文件格式不对（需本页导出的JSON）"); } };
  r.readAsText(f,"utf-8");
}

document.getElementById("nav").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  VIEW=b.dataset.v; setTab(VIEW); render();
});

load(); render();
</script>
