name: Environment compatibility

on:
  push:
    branches: ["chore/unify-environment"]
  pull_request:
    branches: ["main"]
    paths:
      - "requirements*.txt"
      - "tools/check_env.py"
      - "docs/00_environment.md"
      - ".github/workflows/environment-compat.yml"
      - "src/**"
      - "run_all.py"
  workflow_dispatch:

jobs:
  base-compat:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install portable base
        run: python -m pip install -r requirements.txt
      - name: Environment self-check
        run: python tools/check_env.py
      - name: Import smoke test
        run: python -c "import numpy, matplotlib; print('numpy', numpy.__version__); print('matplotlib', matplotlib.__version__)"
      - name: Legacy pipeline smoke test
        run: python run_all.py --legacy-demo
