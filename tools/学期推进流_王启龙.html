/* ================= 状态（localStorage 持久化） ================= */
const SKEY = "semester_flow_leader_v1";
let S = {done:{}, checks:{}, notes:{}, log:[], res:{}};
function load(){ try{ const raw = localStorage.getItem(SKEY); if(raw) S = Object.assign(S, JSON.parse(raw)); }catch(e){ warnLS(); } }
function warnLS(){ setTimeout(()=>{ const el=document.getElementById('hmeta'); if(el) el.insertAdjacentHTML('beforeend','<span class="chip dead">⚠ 本浏览器禁止本地存储，进度仅本次有效，请及时导出</span>'); },0); }
function save(){ try{ localStorage.setItem(SKEY, JSON.stringify(S)); }catch(e){} }
function logAct(action, id, text){ S.log.unshift({t:fmtDT(new Date()),action,id,text}); if(S.log.length>800) S.log.length=800; save(); }
function fmtDT(d){ const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }

/* ================= 工具函数 ================= */
function weekNoNow(){ const d=new Date(); const diff=Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate())-START)/(7*864e5))+1; return Math.max(0,Math.min(NWEEK+1,diff)); }
function wkDoneCount(w){ let n=S.checks?0:0; n=0; w.tasks.forEach(([id])=>{ if(S.done[id]) n++; }); MANUALS.filter(m=>m.week===w.no).forEach(m=>{ if(S.done[m.id]) n++; }); w.checks.forEach(c=>{ if(S.checks[c.id]) n++; }); return n; }
function wkTotal(w){ return w.tasks.length + MANUALS.filter(m=>m.week===w.no).length + w.checks.length; }
function overall(){ let d=0,t=0; WEEKS.forEach(w=>{ d+=wkDoneCount(w); t+=wkTotal(w); }); return [d,t]; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function msDone(m){ return m.need.length>0 && m.need.every(id => S.checks[id] || S.done[id]); }
function findTask(id){ for(const w of WEEKS){ for(const [tid,tx] of w.tasks){ if(tid===id) return {tx,week:w.no}; } } for(const m of MANUALS){ if(m.id===id) return {tx:m.text,week:m.week,manual:true}; } for(const w of WEEKS){ for(const c of w.checks){ if(c.id===id) return {tx:c.desc,week:w.no,check:true}; } } for(const r of RES){ if(r.id===id) return {tx:r.name,week:r.wk,res:true}; } return {tx:id,week:"?"}; }

  document.getElementById("hmeta").innerHTML =
    `<span class="chip">📅 ${wnTxt} · 2026-09-07 开学 · 16周</span>`+
    `<span class="chip">📈 总打卡 ${d}/${t}（${pct}%）</span>`+

}

}

  let rows = WEEKS.map(w=>{ const d=wkDoneCount(w),t=wkTotal(w),p=t?Math.round(d*100/t):0;
    return `<tr class="wrow ${w.no===wn?'now':''}" onclick="goWeek(${w.no})">
      <td><b>W${w.no}</b></td><td>${w.dates}</td><td>${w.stage}</td><td>${esc(w.theme)}</td>
      <td><div class="prow" style="margin:0"><div class="bar"><i style="width:${p}%"></i></div><span class="count">${d}/${t}</span></div></td></tr>`; }).join("");
  const ms = MILESTONES.map(m=>`<div class="mst ${msDone(m)?'ok':''}"><span class="mid">${m.id}</span>W${m.week} ${esc(m.name)} ${msDone(m)?'<span class="ok-emoji">✓</span>':`<span class="count">待 ${m.need.join(" ")||'现场'}</span>`}</div>`).join("");
  return `<div class="card"><h2>🗓 16 周总览：每周 学什么 · 做什么 · 查什么</h2>
    <table><tr><th>周</th><th>日期</th><th>学习线</th><th>主题</th><th>打卡进度</th></tr>${rows}</table>
    <div class="hint">点任意一行进入那一周的卡片。还没到时间的检查项空着是正常的，到了时间自然要补上。</div></div>
  <div class="card"><h2>🎯 阶段目标 M1–M9</h2>${ms}</div>`;
}

/* ---- 周卡片·打卡 ---- */
function vWeek(n){
  const w = WEEKS[n-1];
  const tasks = w.tasks.map(([id,tx])=>{
    const done = S.done[id];
    return `<label class="item ${done?'done':''}"><input type="checkbox" data-k="done" data-id="${id}" ${done?'checked':''}>
      <span class="tx"><span class="id">${id}</span>${esc(tx)}${done?`<span class="ts">✓ ${esc(S.done[id].slice(5,16))}</span>`:''}</span></label>`; }).join("");
  const mans = MANUALS.filter(m=>m.week===w.no).map(m=>{
    const done=S.done[m.id]; const over = m.dead && !done && new Date(m.dead.replace(/-/g,'/'))<new Date();
    return `<label class="item ${done?'done':''} ${over?'overdue':''}"><input type="checkbox" data-k="done" data-id="${m.id}" ${done?'checked':''}>
      <span class="tx"><span class="id">${m.id}</span>${esc(m.text)}${m.dead?`<span class="dl">截止 ${m.dead}</span>`:''}${done?`<span class="ts">✓ ${esc(S.done[m.id].slice(5,16))}</span>`:''}</span></label>`; }).join("");
  const checks = w.checks.map(c=>{
    const done=S.checks[c.id];
    return `<label class="item ${done?'done':''}"><input type="checkbox" data-k="check" data-id="${c.id}" ${done?'checked':''}>
      <span class="tx"><span class="id">${c.id}</span><b>${esc(c.desc)}</b><br><span class="kv">过关标准：<b>${esc(c.exp)}</b> ｜ 出处：${esc(c.src)}</span>${done?`<span class="ts">已实测✓ ${esc(S.checks[c.id].slice(5,16))}</span>`:''}</span></label>`; }).join("");
  const learn = w.learn.map(t=>`<div>· ${esc(t)}</div>`).join("");
  const vids = RES.filter(r=>r.wk===w.no).map(r=>{
    const done=S.res[r.id];
    const link = r.kw?`<a href="https://search.bilibili.com/all?keyword=${encodeURIComponent(r.kw)}" target="_blank">B站搜“${esc(r.kw)}”</a>`:(r.url?`<a href="${r.url}" target="_blank">官方文档↗</a>`:``);
    return `<label class="item ${done?'done':''}"><input type="checkbox" data-k="res" data-id="${r.id}" ${done?'checked':''}>
      <span class="tx"><span class="id">${r.id}</span><b>${esc(r.name)}</b>：${esc(r.what)}${link?`｜${link}`:''}${done?`<span class="ts">已看✓</span>`:''}</span></label>`; }).join("");
  const coord = w.coord.map(t=>`<div>· ${esc(t)}</div>`).join("");
  const c = w.card;
  const d=wkDoneCount(w),t=wkTotal(w),p=t?Math.round(d*100/t):0;
  return `
  <div class="wknav">
    <button class="act o" onclick="goWeek(${Math.max(1,n-1)})">‹ 上一周</button>
    <select id="wksel" onchange="goWeek(+this.value)">${WEEKS.map(x=>`<option value="${x.no}" ${x.no===n?'selected':''}>第${x.no}周 ${x.dates} ${x.theme.slice(0,12)}</option>`).join("")}</select>
    <button class="act o" onclick="goWeek(${Math.min(NWEEK,n+1)})">下一周 ›</button>
    <span class="chip b">完成 ${d}/${t}（${p}%）</span>
    <button class="act g" onclick="report(${n})">生成周报</button>
    <button class="act o" onclick="window.print()">打印本卡</button>
  </div>
  <div class="card"><h2>第 ${w.no} 周 · ${esc(w.theme)} <span class="tag b">${w.stage}</span><span class="tag">${w.dates}</span></h2>
    <div class="prow"><div class="bar"><i style="width:${p}%"></i></div></div>
    <h3>📚 AIDD 学习（${w.stage}）</h3>${learn}
    ${vids?`<h3>📺 本周要看的教学视频（看完打勾）</h3>${vids}`:``}
    <h3>🧪 本周学习检查（达到过关标准再打勾）</h3>
    <table>
      <tr><td class="kv" style="width:84px">学什么做什么</td><td>${esc(c.task)}</td></tr>
      <tr><td class="kv">怎么动手</td><td><span class="cmd">${esc(c.cmd)}</span></td></tr>
      <tr><td class="kv">过关标准</td><td><b>${esc(c.expected)}</b></td></tr>
      <tr><td class="kv">出处</td><td>${esc(c.source)}</td></tr>
      <tr><td class="kv">没过怎么办</td><td>${esc(c.criteria)}</td></tr>
      <tr><td class="kv">谁来检查</td><td>${esc(c.verifier)}</td></tr>
    </table>
    ${w.ex?`<div class="exp">练习文件：learning/王启龙/${w.ex.file} ｜ 生成练习模板：<span class="cmd">学期推进流_王启龙.exe ${w.ex.gen}</span> ｜ 写完自动判分：<span class="cmd">check ${w.no}</span></div>`:''}
    <h3>✅ 项目任务（做完就点一下打勾）</h3>${tasks}
    ${mans?`<h3>🧾 外部/手工事项（平台或线下，打卡留痕）</h3>${mans}`:''}
    <h3>🔍 本周自动检查（先跑命令，看到[通过]再勾）</h3>${checks}
    <h3>👥 负责人统筹</h3>${coord}
    <h3>📝 本周备注（记实测数字、遇到的问题、要交给谁）</h3>
    <textarea id="wnote" placeholder="例如：W3 RDKit重算 MW 偏差均值+18.2（三萜系统偏大），已移交衣思淼并入WP3。">${esc(S.notes[n]||"")}</textarea>
    <div class="hint">检查命令：<span class="cmd">学期推进流_王启龙.exe check ${w.no} --deep</span>（在仓库 tools/ 文件夹里运行）。打勾记录都在「打卡台账」页。</div>
  </div>`;
}

/* ---- 学习资源 ---- */
function vRes(){
  const item=r=>{
    const done=S.res[r.id];
    const link = r.kw?`<a href="https://search.bilibili.com/all?keyword=${encodeURIComponent(r.kw)}" target="_blank">B站搜“${esc(r.kw)}”</a>`:(r.url?`<a href="${r.url}" target="_blank">打开↗</a>`:``);
    return `<label class="item ${done?'done':''}"><input type="checkbox" data-k="res" data-id="${r.id}" ${done?'checked':''}>
      <span class="tx"><span class="id">${r.id}</span><b>${esc(r.name)}</b>：${esc(r.what)}${link?`｜${link}`:''}${done?`<span class="ts">已看✓ ${esc(S.res[r.id].slice(5,16))}</span>`:''}</span></label>`; };
  const resDone = RES.filter(r=>S.res[r.id]).length;
  let html = `<div class="card res"><h2>📺 教学视频（看完 ${resDone}/${RES.length}）</h2>`;
  const g0 = RES.filter(r=>r.wk===0);
  if(g0.length) html += `<h3>🧭 随时能看的补课（生信那几集是旧课题的基因数据材料）</h3>` + g0.map(item).join("");
  WEEKS.forEach(w=>{ const its=RES.filter(r=>r.wk===w.no); if(its.length)
    html += `<h3>W${w.no}（${w.dates}）· ${w.stage}｜${esc(w.theme)}</h3>` + its.map(item).join(""); });
  html += `<div class="hint">视频来自《AIDD 28天突进系统》那份材料，按主题排进了 16 周。点"B站搜…"直接打开B站搜索页；"P几"是建议优先看的集数，仅供参考；看完就打勾。</div></div>`;
  html += `<h2 style="font-size:17px;margin:22px 0 10px;color:var(--brand)">🔬 网站、论文和名词解释</h2>`;
  html += FRONTIER.map(g=>`<div class="card" style="margin-bottom:12px"><h2 style="font-size:15px">${esc(g.g)}</h2>${
    g.items.map(it=>`<div class="item"><span class="tx"><b>${esc(it.n)}</b>：${esc(it.d)}${it.u?`｜<a href="${it.u}" target="_blank">${esc(it.u.replace(/^https?:\/\//,'').split('/')[0])}↗</a>`:''}</span></div>`).join("")}</div>`).join("");
  html += `<div class="card"><h2>🗓 28 天速查表（寒假突击 / 新同学入组用）</h2>
    <table class="d28"><tr><th>天</th><th>阶段</th><th>主题</th><th>当日验收</th></tr>${
    DAYS28.map(r=>`<tr><td><b>D${r[0]}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td class="kv">${esc(r[3])}</td></tr>`).join("")}</table>
    <div class="hint">这张 28 天表是给旧课题（抗MASH）写的速成计划：D2–D7 是基因数据部分（当作补课材料看），D8–D28 和现在项目的流程一一对应。寒假突击、或者新同学进组，都可以直接照着来。</div></div>`;
  return html;
}

/* ---- 打卡台账 ---- */
function vLedger(){
  const [d,t] = overall();
  const lines = S.log.map(l=>{
    const icon = l.action==="打卡"?"✅":(l.action==="取消"?"↩️":(l.action==="核验"?"🧪":"📝"));
    return `<div class="logline"><span class="t">${l.t}</span><span>${icon} ${esc(l.action)}</span><span class="id">${esc(l.id)}</span><span>${esc(l.text)}</span></div>`; }).join("");
  const notes = WEEKS.filter(w=>(S.notes[w.no]||"").trim()).map(w=>`<div class="logline"><span class="t">W${w.no} 备注</span><span>${esc(S.notes[w.no]).replace(/\n/g,"<br>")}</span></div>`).join("");
  return `<div class="card"><h2>✅ 打卡台账</h2>
    <div class="kv">累计打卡 <b>${d}/${t}</b> ｜ 里程碑 <b>${MILESTONES.filter(msDone).length}/${MILESTONES.length}</b> ｜ 记录 <b>${S.log.length}</b> 条</div>
    <div style="margin-top:10px">${lines||'<div class="kv">（暂无打卡记录）</div>'}</div></div>
  <div class="card"><h2>📝 各周备注汇总</h2>${notes||'<div class="kv">（暂无）</div>'}</div>`;
}

/* ---- 数据管理 ---- */
function vData(){
  return `<div class="card"><h2>💾 数据管理（换电脑/备份）</h2>
    <p class="lead">进度存于本机浏览器 localStorage。换电脑或换浏览器时：旧机「导出」→ 新机「导入」。</p>
    <button class="act" onclick="exp()">⬇ 导出进度JSON</button>
    <label class="act o" style="display:inline-block;cursor:pointer">⬆ 导入进度JSON<input type="file" accept=".json" style="display:none" onchange="imp(this)"></label>
    <button class="act d" onclick="if(confirm('确定清空全部打卡与备注？（仓库文件不受影响）')){S={done:{},checks:{},notes:{},log:[]};save();render();}">🗑 清空重置</button>
    <div class="hint">导入会覆盖当前进度。周报在周卡片页生成（复制 Markdown 粘贴到邮件/文档发导师）。</div></div>
  <div class="card"><h2>📖 三线说明</h2>
    <div class="kv">每周就三步：① <b>周一</b>开组会领任务；② <b>周中</b>照卡片"怎么动手"做（练习模板用工具生成）；③ <b>周五</b>跑检查命令，全[通过]再打勾，然后生成周报发导师。周日记得把代码推上去备份。</div></div>`;
}

/* ================= 交互 ================= */
function goWeek(n){ CURW=Math.max(1,Math.min(NWEEK,n)); VIEW="week"; setTab("week"); render(); }
function setTab(v){ document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v)); }

function bind(){
  document.querySelectorAll("#app input[type=checkbox]").forEach(cb=>{
    cb.addEventListener("change",()=>{
      const id=cb.dataset.id, kind=cb.dataset.k;
      const info=findTask(id);
      if(kind==="check"){
        if(cb.checked && !confirm(`检查纪律：${id} 这件事真的做完了吗？要有证据（命令显示[通过]、生成的文件、截图、文献编号）才能打勾，不凭印象。`)){ cb.checked=false; return; }
        if(cb.checked){ S.checks[id]=fmtDT(new Date()); logAct("核验",id,info.tx); }
        else { delete S.checks[id]; logAct("取消",id,info.tx); }
      } else if(kind==="res"){
        if(cb.checked){ S.res[id]=fmtDT(new Date()); logAct("资源",id,info.tx); }
        else { delete S.res[id]; logAct("取消",id,info.tx); }
      } else {
        if(cb.checked){ S.done[id]=fmtDT(new Date()); logAct("打卡",id,info.tx); }
        else { delete S.done[id]; logAct("取消",id,info.tx); }
      }
      save(); render();
    });
  });
  const ta=document.getElementById("wnote");
  if(ta){ ta.addEventListener("change",()=>{ const n=CURW; const old=S.notes[n]||""; S.notes[n]=ta.value; if(old!==ta.value) logAct("备注","W"+n,(ta.value||"（清空）").slice(0,40)+"…"); save(); }); }
}

function report(n){
  const w=WEEKS[n-1], c=w.card;
  const lines=[];
  lines.push(`# 周报 · 第 ${n} 周（${w.dates}）· ${w.theme}`,"",
    `生成：学期推进流HTML打卡页 · ${fmtDT(new Date())}`,"","## 任务完成情况","");
  w.tasks.forEach(([id,tx])=>lines.push(`- [${S.done[id]?'x':' '}] ${id} ${tx}`));
  MANUALS.filter(m=>m.week===n).forEach(m=>lines.push(`- [${S.done[m.id]?'x':' '}] ${m.id} ${m.text}`));
  lines.push("","## 本周学习检查","",
    `- 学什么做什么：${c.task}`,`- 怎么动手：${c.cmd}`,`- 过关标准：${c.expected}`,`- 出处：${c.source}`,`- 没过怎么办：${c.criteria}`,`- 谁来检查：${c.verifier}`);
  const vids = RES.filter(r=>r.wk===n);
  if(vids.length){ lines.push("","## 本周视频学习","");
    vids.forEach(r=>lines.push(`- [${S.res[r.id]?'x':' '}] ${r.name}：${r.what}${r.kw?`（B站搜：${r.kw}）`:''}`)); }
  lines.push("","## 自动检查情况","");
  w.checks.forEach(ck=>lines.push(`- ${S.checks[ck.id]?'[已实测✓ '+S.checks[ck.id]+']':'[待验]'} ${ck.id} ${ck.desc}｜预期：${ck.exp}｜依据：${ck.src}`));
  if((S.notes[n]||"").trim()) lines.push("","## 本周备注","",S.notes[n]);
  const nxt=WEEKS[n]; if(nxt) lines.push("","## 下周预告","",`- 第 ${nxt.no} 周（${nxt.dates}）：${nxt.theme}（${nxt.stage}）`);
  const md=lines.join("\n");
  const ta=document.createElement("textarea"); ta.value=md; document.body.appendChild(ta); ta.select();
  let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  if(navigator.clipboard) navigator.clipboard.writeText(md).catch(()=>{});
  const w2=window.open("","_blank");
  if(w2){ w2.document.write(`<pre style="font-family:Consolas,monospace;white-space:pre-wrap;padding:20px">${md.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</pre>`); }
  alert(ok?"周报已复制到剪贴板（可直接粘贴发导师），同时在新窗口打开预览":"周报已在新窗口打开，可全选复制");
}

function exp(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`学期推进流打卡_${fmtDT(new Date()).replace(/[-: ]/g,"").slice(0,12)}.json`; a.click();
}
function imp(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d||typeof d!=="object"||!("done" in d)) throw 0;
      if(confirm("导入将覆盖当前进度，继续？")){ S=Object.assign({done:{},checks:{},notes:{},log:[]},d); save(); render(); alert("导入成功"); } }
    catch(e){ alert("文件格式不对（需本页导出的JSON）"); } };
  r.readAsText(f,"utf-8");
}

document.getElementById("nav").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  VIEW=b.dataset.v; setTab(VIEW); render();
});

load(); render();
</script>
</body>
</html>
